plugins { id 'eclipse'; id 'maven-publish'; id 'net.minecraftforge.gradle' version '6.0.54' }
version = '0.1.0'
group = 'dev.dungeongates'
base { archivesName = 'dungeon-gates-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
 mappings channel: 'official', version: '1.20.1'
 copyIdeResources = true
 runs {
  configureEach {
   workingDirectory project.file('run')
   property 'forge.logging.console.level', 'info'
   property 'mixin.env.remapRefMap', 'true'
   property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
   mods { dungeongates { source sourceSets.main } }
  }
  client { }
  server { args '--nogui' }
  gameTestServer {
   property 'forge.enabledGameTestNamespaces', 'dungeongates'
   property 'dungeongates.qa', 'true'
  }
 }
}
repositories { maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }; mavenCentral() }
dependencies {
 minecraft 'net.minecraftforge:forge:1.20.1-47.3.22'
 implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { manifest.attributes(['Specification-Title':'Dungeon Gates','Implementation-Version':project.version]); finalizedBy 'reobfJar' }
sourceSets { testmod { java.setSrcDirs(['src/testmod/java']); resources.setSrcDirs(['src/testmod/resources']); compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output } }
configurations { testmodImplementation.extendsFrom implementation; testmodRuntimeOnly.extendsFrom runtimeOnly }
minecraft.runs.configureEach { mods { dungeongatesqa { source sourceSets.testmod } } }
tasks.register('qaJar', Jar) { archiveClassifier='qa'; from sourceSets.testmod.output }
reobf { qaJar { libraries.from(sourceSets.main.output) } }
if (project.hasProperty('clientQA')) { minecraft.runs.client { property 'dungeongates.clientqa','true'; jvmArgs '-Xmx2500m'; workingDirectory project.file('run-client') } }
